name: Release Asset

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload-asset:
    name: Build & Attach Release Zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip integration for HACS
        run: |
          cd custom_components/nexus_mcp
          zip -r ../../nexus_mcp.zip . -x "*.pyc" -x "*/__pycache__/*"
          cd ../..

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus_mcp.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
